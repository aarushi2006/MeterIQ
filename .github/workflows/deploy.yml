name: Deploy frontend to GitHub Pages

# GitHub Pages can only host the static frontend. The Express API, MongoDB
# database and FastAPI ML service are deployed separately; this workflow only
# builds the frontend and points it at the deployed API.
on:
  push:
    branches: ["master", "main"]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # A build pointed at localhost would deploy a frontend that cannot reach
      # any API. Fail loudly instead of publishing a broken site.
      - name: Validate production API URL
        env:
          API_URL: ${{ vars.VITE_API_BASE_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Repository variable VITE_API_BASE_URL is not set."
            echo "Set it to the deployed backend, e.g. https://meteriq-api.onrender.com/api"
            echo "  gh variable set VITE_API_BASE_URL --repo ${{ github.repository }} --body 'https://<backend>/api'"
            exit 1
          fi
          case "$API_URL" in
            http://localhost*|http://127.0.0.1*)
              echo "::error::VITE_API_BASE_URL must not point at localhost in a Pages deployment."
              exit 1
              ;;
          esac
          echo "Building against $API_URL"

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          # Project sites are served from /<repo>/, user/org sites from /.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

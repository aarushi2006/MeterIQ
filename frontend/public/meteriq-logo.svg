<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="200" y2="200">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#1a5276"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a8fc4"/>
      <stop offset="100%" stop-color="#5dade2"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="90" r="80" fill="url(#bg)"/>
  <circle cx="100" cy="90" r="72" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.6"/>
  <!-- Bar chart -->
  <rect x="42" y="65" width="8" height="30" rx="2" fill="#5dade2" opacity="0.7"/>
  <rect x="54" y="52" width="8" height="43" rx="2" fill="#3498db" opacity="0.8"/>
  <rect x="66" y="42" width="8" height="53" rx="2" fill="#2e86c1" opacity="0.85"/>
  <rect x="78" y="32" width="8" height="63" rx="2" fill="#2874a6" opacity="0.9"/>
  <!-- Trend line -->
  <polyline points="46,63 58,50 70,40 82,30" fill="none" stroke="#5dade2" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="46" cy="63" r="3" fill="#5dade2"/>
  <circle cx="58" cy="50" r="3" fill="#5dade2"/>
  <circle cx="70" cy="40" r="3" fill="#5dade2"/>
  <circle cx="82" cy="30" r="3" fill="#5dade2"/>
  <!-- Meter body -->
  <rect x="95" y="45" width="55" height="70" rx="8" fill="#1a5276" stroke="#5dade2" stroke-width="1.5"/>
  <rect x="100" y="50" width="45" height="28" rx="4" fill="#0a2540"/>
  <text x="122" y="68" text-anchor="middle" font-family="monospace" font-size="12" fill="#5dade2" font-weight="bold">00482.6</text>
  <text x="122" y="78" text-anchor="middle" font-family="sans-serif" font-size="6" fill="#85c1e9">kWh</text>
  <!-- Meter dots -->
  <circle cx="105" cy="90" r="2.5" fill="#5dade2"/>
  <circle cx="113" cy="90" r="2.5" fill="#3498db"/>
  <circle cx="121" cy="90" r="2.5" fill="#2874a6"/>
  <!-- City skyline -->
  <rect x="155" y="60" width="8" height="25" rx="1" fill="#1a5276" opacity="0.5"/>
  <rect x="166" y="50" width="6" height="35" rx="1" fill="#1a5276" opacity="0.4"/>
  <rect x="175" y="55" width="10" height="30" rx="1" fill="#1a5276" opacity="0.35"/>
  <!-- Power lines -->
  <line x1="178" y1="65" x2="195" y2="58" stroke="#5dade2" stroke-width="1" opacity="0.4"/>
  <line x1="178" y1="72" x2="195" y2="68" stroke="#5dade2" stroke-width="1" opacity="0.4"/>
  <!-- Leaves -->
  <ellipse cx="185" cy="95" rx="10" ry="5" fill="#1a8fc4" opacity="0.25" transform="rotate(-30 185 95)"/>
  <ellipse cx="192" cy="88" rx="8" ry="4" fill="#5dade2" opacity="0.2" transform="rotate(-45 192 88)"/>
  <!-- Waves -->
  <path d="M30 120 Q55 110 80 120 Q105 130 130 120 Q155 110 180 120" fill="none" stroke="#1a8fc4" stroke-width="2" opacity="0.3"/>
  <path d="M30 130 Q55 120 80 130 Q105 140 130 130 Q155 120 180 130" fill="none" stroke="#5dade2" stroke-width="1.5" opacity="0.2"/>
  <!-- METER text -->
  <text x="100" y="158" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#0a2540" letter-spacing="3">METER</text>
  <!-- IQ with lightbulb -->
  <text x="100" y="158" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="32" fill="transparent" letter-spacing="3">METER</text>
  <text x="155" y="158" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="32" fill="#1a8fc4" letter-spacing="1">IQ</text>
  <!-- Subtitle -->
  <line x1="20" y1="168" x2="180" y2="168" stroke="#1a8fc4" stroke-width="1" opacity="0.3"/>
  <text x="100" y="180" text-anchor="middle" font-family="sans-serif" font-weight="600" font-size="7" fill="#1a5276" letter-spacing="3">SMART METER ANALYTICS PLATFORM</text>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="5.5" fill="#5dade2" letter-spacing="2">YASHIT ARORA  |  AARUSHI GAHLAWAT</text>
</svg>

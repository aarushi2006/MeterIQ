
# MeterIQ Render Blueprint
# Frontend: Vercel
# Database: MongoDB Atlas

services:
  # Backend API
  - type: web
    name: meteriq-api
    runtime: docker
    rootDir: code/backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 8h

      - key: MONGODB_URI
        sync: false

      - key: ML_SERVICE_URL
        sync: false

      - key: ML_SERVICE_TIMEOUT_MS
        value: 60000

      - key: FRONTEND_URL
        sync: false

      - key: TRUST_PROXY
        value: "1"

  # Machine Learning Service
  - type: web
    name: meteriq-ml
    runtime: docker
    rootDir: code/ml-service
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: ML_CORS_ORIGINS
        sync: false

      - key: METERIQ_OUTPUT_DIR
        value: /app/data/output

      - key: METERIQ_CACHE_DIR
        value: /app/data/cache
